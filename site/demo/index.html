<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bugsnap demo</title>
<style>
  :root {
    --bg: #0a0e16;
    --panel: #0f1420;
    --line: #1e2636;
    --text: #c9d4e5;
    --muted: #7d8aa0;
    --green: #6ee7a8;
    --red: #ff7b72;
    --accent: #7aa2ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1100px 600px at 50% -10%, #16203a 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 40px;
  }
  .app { width: 100%; max-width: 1000px; }
  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 18px; }
  .brand { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: #eef3ff; }
  .brand span { color: var(--accent); }
  .tag { color: var(--muted); font-size: 14px; }
  .window {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45);
    overflow: hidden;
  }
  .titlebar {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    background: #0c111b;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #39445a; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .path { margin-left: 10px; color: var(--muted); font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #term {
    padding: 20px 22px 24px;
    min-height: 410px;
    font: 15px/1.6 ui-monospace, SFMono-Regular, Menlo, "Cascadia Code", monospace;
    white-space: pre-wrap;
  }
  .line { min-height: 1.6em; }
  .prompt { color: var(--green); }
  .cmd { color: #eef3ff; }
  .out { color: var(--text); }
  .dim { color: var(--muted); }
  .fail { color: var(--red); }
  .ok { color: var(--green); }
  .footer { display: flex; align-items: center; gap: 18px; margin-top: 20px; }
  button {
    appearance: none; border: 1px solid #2c3a55; cursor: pointer;
    background: linear-gradient(#1a2540, #131b2e); color: #eaf1ff;
    font: 600 15px/1 inherit; padding: 13px 22px; border-radius: 10px;
    transition: transform .08s ease, border-color .2s;
  }
  button:hover { border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .5; cursor: default; }
  .status { color: var(--muted); font: 13px/1.4 ui-monospace, Menlo, monospace; }
  .status.ok { color: var(--green); }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">bug<span>snap</span></div>
      <div class="tag">capture once · replay anywhere</div>
    </header>

    <div class="window">
      <div class="titlebar">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        <span class="path">~/demo/cart</span>
      </div>
      <div id="term"></div>
    </div>

    <div class="footer">
      <button id="replay">Replay demo</button>
      <div id="status" class="status"></div>
    </div>
  </div>

<script>
const script = [
  { k: "cmd", t: "bugsnap capture -- go test ./..." },
  { k: "out", t: "captured bugsnap-20261120T140757Z.zip" },
  { k: "out", t: "  host:    darwin/arm64" },
  { k: "out", t: "  git:     9bf008c43833" },
  { k: "out", t: "  command: exit 1" },
  { k: "gap" },
  { k: "cmd", t: "bugsnap inspect bugsnap-20261120T140757Z.zip" },
  { k: "out", t: "bugsnap bundle (v1)" },
  { k: "out", t: "  command: go test ./...  exit=1  1292ms" },
  { k: "out", t: "  git:     9bf008c43833 (main, dirty)" },
  { k: "out", t: "  7 files · environment diff clean" },
  { k: "gap" },
  { k: "cmd", t: "bugsnap replay bugsnap-20261120T140757Z.zip --apply --run" },
  { k: "out", t: "applied git patch and restored dependency files" },
  { k: "out", t: "running: go test ./..." },
  { k: "blank" },
  { k: "fail", t: "--- FAIL: TestTotal (0.00s)" },
  { k: "fail", t: "    cart_test.go:7: expected 30, got 40" },
  { k: "fail", t: "FAIL" },
  { k: "fail", t: "FAIL    example.com/cart    0.331s" }
];

const term = document.getElementById("term");
const statusEl = document.getElementById("status");
const btn = document.getElementById("replay");
let running = false;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function addLine(cls) {
  const d = document.createElement("div");
  d.className = "line " + cls;
  term.appendChild(d);
  return d;
}

async function typeLine(el, text) {
  for (const ch of text) {
    el.textContent += ch;
    await sleep(16);
  }
}

async function play() {
  if (running) return;
  running = true;
  btn.disabled = true;
  statusEl.textContent = "";
  statusEl.className = "status";
  term.innerHTML = "";

  for (const item of script) {
    if (item.k === "gap") { await sleep(420); continue; }
    if (item.k === "blank") { addLine("out").textContent = "\u00a0"; await sleep(160); continue; }
    if (item.k === "cmd") {
      const d = addLine("cmd");
      const p = document.createElement("span");
      p.className = "prompt";
      p.textContent = "$ ";
      d.appendChild(p);
      const s = document.createElement("span");
      d.appendChild(s);
      await typeLine(s, item.t);
      await sleep(360);
    } else {
      const d = addLine(item.k);
      d.textContent = item.t;
      await sleep(item.k === "fail" ? 150 : 55);
    }
  }

  statusEl.textContent = "replay complete — reproduced on a clean clone (exit 1)";
  statusEl.classList.add("ok");
  running = false;
  btn.disabled = false;
}

btn.addEventListener("click", play);
</script>
</body>
</html>
